services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loginsight
      POSTGRES_PASSWORD: loginsight
      POSTGRES_DB: loginsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loginsight -d loginsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://loginsight:loginsight@postgres:5432/loginsight
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
